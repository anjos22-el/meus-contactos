<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Contactos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 420px;
      text-align: center;
      background: white;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 14px 0;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .whatsapp {
      background: #25D366;
    }

    .email {
      background: #4285F4;
    }

    .phone {
      background: #222;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Entre em contacto</h1>

    <p>Escolha uma das opções abaixo:</p>

    <a class="btn whatsapp"
       href="https://wa.me/244924999736">
       💬 WhatsApp
    </a>

    <a class="btn email"
       href="mailto:gotadsol29@gmail.com">
       📧 E-mail
    </a>

    <a class="btn phone"
       href="tel:+244924999736">
       📞 Ligar
    </a>

  </div>

</body>
</html>
